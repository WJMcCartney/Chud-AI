name = "lil-chud"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

[vars]
# Gemini model(s) to use, comma-separated. If one is overloaded, the next is tried.
GEMINI_MODEL = "gemini-flash-latest,gemini-flash-lite-latest"
# Set this to your GitHub Pages origin once it's live, e.g. "https://yourname.github.io"
# "*" lets any website call the worker (fine for local testing).
ALLOWED_ORIGIN = "https://wjmccartney.github.io"

# The API key is a secret, NOT a var. Set it with:
#   npx wrangler secret put GEMINI_API_KEY
